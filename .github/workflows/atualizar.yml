name: Atualizar dados (reserva)

# A coleta diária roda no computador do responsável (o site da Câmara bloqueia os servidores do GitHub).
# Este workflow fica só como reserva: botão "Run workflow" para recalcular o site ou coletar a API.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "montar = só recalcula o site | api = coleta a API e recalcula"
        default: montar

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m testes.test_coletor
      - name: Coletar e montar
        env:
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.modo }}" = "api" ]; then
            python -m coletor.coletar api
          fi
          python -m coletor.coletar montar
      - name: Publicar
        run: |
          git config user.name "quem-paga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dados
          if git diff --cached --quiet; then echo "Nada mudou."; else
            git commit -m "Atualização manual pelo GitHub ($(date +%d/%m/%Y))"
            git push
          fi
